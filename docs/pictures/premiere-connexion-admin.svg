<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Création de l’administrateur Flow.io 3.1.5</title>
  <desc id="desc">Capture documentaire anonymisée de la page Rescue avec récupération physique BOOT et formulaire de création de l’administrateur.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06182b" flood-opacity=".24"/></filter>
    <style>.ui{font-family:Arial,sans-serif}.h1{font-size:30px;font-weight:700;fill:#fff}.h2{font-size:22px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#bed1e5}.small{font-size:14px;fill:#91aac3}.mono{font-family:Consolas,monospace;font-size:15px;fill:#58dccd}.label{font-size:15px;font-weight:700;fill:#eaf3fc}.buttonText{font-size:15px;font-weight:700;fill:#fff}.call{font-size:17px;font-weight:700;fill:#0a2742}</style>
  </defs>
  <rect width="1440" height="900" fill="#eaf2fa"/>
  <text x="55" y="60" class="ui" style="font-size:30px;font-weight:700;fill:#0a2742">Créer ou remplacer l’administrateur — Flow.io 3.1.5</text>
  <rect x="55" y="92" width="1330" height="64" rx="14" fill="#fff5d9" stroke="#e9ba40"/>
  <circle cx="91" cy="124" r="18" fill="#f4b82e"/><text x="85" y="131" class="ui" style="font-size:20px;font-weight:700;fill:#fff">1</text>
  <text x="124" y="130" class="ui call">Carte démarrée normalement : maintenir BOOT 5 secondes, relâcher, puis cliquer sur Rafraîchir.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="190" width="1220" height="650" rx="18" fill="#0b192a"/>
    <rect x="110" y="190" width="1220" height="60" rx="18" fill="#10233a"/>
    <text x="145" y="229" class="ui h1">flow.io Rescue</text>
    <text x="145" y="278" class="ui body">Console minimale embarquée, disponible même sans interface SPIFFS.</text>

    <rect x="145" y="305" width="550" height="255" rx="13" fill="#10233a" stroke="#365778"/>
    <text x="170" y="342" class="ui h2">État</text>
    <rect x="170" y="362" width="185" height="44" rx="8" fill="#173450" stroke="#4d7398"/>
    <text x="222" y="390" class="ui buttonText">Rafraîchir</text>
    <rect x="170" y="425" width="500" height="112" rx="9" fill="#061522"/>
    <text x="194" y="456" class="mono">"auth_enabled": false,</text>
    <text x="194" y="486" class="mono">"physical_recovery_active": true,</text>
    <text x="194" y="516" class="mono">"physical_recovery_remaining_s": 284</text>

    <rect x="720" y="305" width="575" height="470" rx="13" fill="#10233a" stroke="#365778"/>
    <text x="748" y="342" class="ui h2">Sécurité Web</text>
    <text x="748" y="374" class="ui body">La récupération physique reste active cinq minutes.</text>
    <text x="748" y="417" class="ui label">Utilisateur administrateur</text>
    <rect x="748" y="432" width="515" height="48" rx="8" fill="#091726" stroke="#557899"/>
    <text x="769" y="462" class="ui small">administrateur</text>
    <text x="748" y="516" class="ui label">Mot de passe (12 à 32 caractères)</text>
    <rect x="748" y="531" width="515" height="48" rx="8" fill="#091726" stroke="#557899"/>
    <text x="769" y="563" class="ui" style="font-size:20px;fill:#b9cce0">••••••••••••••••</text>
    <text x="748" y="617" class="ui label">Confirmer le mot de passe</text>
    <rect x="748" y="632" width="515" height="48" rx="8" fill="#091726" stroke="#557899"/>
    <text x="769" y="664" class="ui" style="font-size:20px;fill:#b9cce0">••••••••••••••••</text>
    <rect x="748" y="704" width="255" height="48" rx="9" fill="#0878f9"/>
    <text x="779" y="734" class="ui buttonText">Enregistrer les accès Web</text>

    <rect x="145" y="590" width="550" height="185" rx="13" fill="#10233a" stroke="#365778"/>
    <circle cx="178" cy="628" r="18" fill="#0878f9"/><text x="172" y="635" class="ui" style="font-size:20px;font-weight:700;fill:#fff">2</text>
    <text x="210" y="634" class="ui label">Vérifier la ligne en vert</text>
    <circle cx="178" cy="677" r="18" fill="#0878f9"/><text x="172" y="684" class="ui" style="font-size:20px;font-weight:700;fill:#fff">3</text>
    <text x="210" y="683" class="ui label">Saisir les deux secrets identiques</text>
    <circle cx="178" cy="726" r="18" fill="#0878f9"/><text x="172" y="733" class="ui" style="font-size:20px;font-weight:700;fill:#fff">4</text>
    <text x="210" y="732" class="ui label">Enregistrer puis attendre le redémarrage</text>
  </g>
</svg>
