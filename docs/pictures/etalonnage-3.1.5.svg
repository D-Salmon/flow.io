<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Page Étalonnage Flow.io 3.1.5</title><desc id="desc">Capture documentaire anonymisée de l’assistant d’étalonnage deux points du pH.</desc>
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324f" flood-opacity=".11"/></filter>
  <style>.u{font-family:Arial,sans-serif}.brand{font-size:29px;font-weight:700;fill:#0a2742}.nav{font-size:17px;font-weight:700;fill:#405b77}.navOn{fill:#0878f9}.h1{font-size:31px;font-weight:700;fill:#0a2742}.h2{font-size:21px;font-weight:800;fill:#0a2742}.h3{font-size:16px;font-weight:800;fill:#0a2742}.b{font-size:14px;fill:#405b77}.sm{font-size:12px;fill:#637d96}.v{font-size:20px;font-weight:800;fill:#0a2742}.card{fill:#fff;stroke:#c3d6e8;stroke-width:1.4}.soft{fill:#f2f7fc;stroke:#c9daea}.btn{fill:#0878f9}.btnTxt{font-size:14px;font-weight:800;fill:#fff}.outline{fill:#fff;stroke:#0878f9;stroke-width:1.4}</style></defs>
  <rect width="1600" height="1000" fill="#f3f7fb"/><rect width="260" height="1000" fill="#fff" stroke="#d5e1ed"/>
  <path d="M38 55 C58 33 78 77 102 49 C85 91 55 65 38 77 C52 57 68 63 86 49" fill="#22b7d7"/><text x="112" y="69" class="u brand">flow.io</text>
  <text x="38" y="152" class="u nav">⌂  Tableau de bord</text><text x="38" y="213" class="u nav">≋  Piscine</text><rect x="16" y="242" width="228" height="50" rx="10" fill="#eaf3ff"/><text x="38" y="274" class="u nav navOn">⚗  Étalonnage</text><text x="38" y="335" class="u nav">↶  Journal d’Activité</text><text x="38" y="396" class="u nav">⇩  Mises à Jour</text><text x="38" y="457" class="u nav">⚙  Configuration</text><text x="38" y="518" class="u nav">▦  Entrées/Sorties</text><text x="38" y="579" class="u nav">ⓘ  Informations</text>
  <text x="305" y="68" class="u h1">Étalonnage</text><text x="1420" y="67" class="u sm">Valeurs d’exemple</text>

  <g filter="url(#s)"><rect x="305" y="105" width="1240" height="825" rx="18" class="card"/><text x="340" y="151" class="u" style="font-size:24px;fill:#0878f9">⚗</text><text x="382" y="150" class="u h2">Assistant</text><text x="340" y="181" class="u b">Étalonnez les sondes piscine via C0/C1 (valeur = C0 × entrée + C1).</text>
    <text x="340" y="229" class="u sm">Sonde</text><rect x="340" y="246" width="495" height="50" rx="9" class="soft"/><text x="362" y="277" class="u b">pH (2 points)</text><text x="802" y="277" class="u b">⌄</text><rect x="855" y="246" width="175" height="50" rx="9" class="outline"/><text x="885" y="277" class="u" style="font-size:14px;font-weight:800;fill:#0878f9">Charger la sonde</text>
    <rect x="340" y="329" width="355" height="82" rx="12" class="soft"/><text x="362" y="357" class="u sm">Module IO</text><text x="362" y="389" class="u v">io/input/a01</text><rect x="715" y="329" width="355" height="82" rx="12" class="soft"/><text x="737" y="357" class="u sm">C0 actuel</text><text x="737" y="389" class="u v">1,0000</text><rect x="1090" y="329" width="355" height="82" rx="12" class="soft"/><text x="1112" y="357" class="u sm">C1 actuel</text><text x="1112" y="389" class="u v">0,0000</text>
    <rect x="340" y="435" width="1105" height="49" rx="10" fill="#eaf3ff" stroke="#a8c7e8"/><text x="362" y="465" class="u b">Mode 2 points actif : recalcul de C0 et C1.</text>
    <text x="340" y="528" class="u h3">Étalonnage 2 points</text>
    <text x="340" y="565" class="u sm">Point 1 — Valeur de référence</text><rect x="340" y="582" width="505" height="50" rx="9" class="soft"/><text x="362" y="613" class="u b">7,00</text>
    <text x="875" y="565" class="u sm">Point 1 — Mesure lue automatiquement</text><rect x="875" y="582" width="400" height="50" rx="9" class="soft"/><text x="897" y="613" class="u b">6,82</text><rect x="1290" y="582" width="155" height="50" rx="9" class="outline"/><text x="1340" y="613" class="u" style="font-size:14px;font-weight:800;fill:#0878f9">↻ Lire</text>
    <text x="340" y="673" class="u sm">Point 2 — Valeur de référence</text><rect x="340" y="690" width="505" height="50" rx="9" class="soft"/><text x="362" y="721" class="u b">10,00</text>
    <text x="875" y="673" class="u sm">Point 2 — Mesure lue automatiquement</text><rect x="875" y="690" width="400" height="50" rx="9" class="soft"/><text x="897" y="721" class="u b">9,76</text><rect x="1290" y="690" width="155" height="50" rx="9" class="outline"/><text x="1340" y="721" class="u" style="font-size:14px;font-weight:800;fill:#0878f9">↻ Lire</text>
    <rect x="340" y="786" width="175" height="50" rx="9" class="outline"/><text x="371" y="817" class="u" style="font-size:14px;font-weight:800;fill:#0878f9">Calculer C0/C1</text><rect x="535" y="786" width="205" height="50" rx="9" class="btn"/><text x="569" y="817" class="u btnTxt">Appliquer sur flow.io</text>
    <rect x="780" y="770" width="665" height="100" rx="12" fill="#f8fbfe" stroke="#c9daea"/><text x="805" y="799" class="u h3">Aperçu avant application</text><text x="805" y="829" class="u sm">C0 : 1,0000 → 1,0204</text><text x="1080" y="829" class="u sm">C1 : 0,0000 → 0,0412</text><text x="805" y="855" class="u sm">Vérifiez les solutions de référence avant d’enregistrer.</text>
  </g>
  <rect x="305" y="947" width="1240" height="35" rx="10" fill="#fff5d9" stroke="#e9ba40"/><text x="330" y="970" class="u sm" style="fill:#765514">Exemple uniquement : saisissez les valeurs de vos solutions étalon et utilisez la mesure réellement lue par le Waveshare.</text>
</svg>
