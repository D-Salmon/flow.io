<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Première connexion Flow.io 3.1.5</title>
  <desc id="desc">Capture documentaire anonymisée montrant le moniteur série, le point d'accès Flow.io et la page Rescue.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16324f" flood-opacity=".16"/></filter>
    <style>
      .ui{font-family:Arial,sans-serif}.h1{font-size:30px;font-weight:700;fill:#0a2742}.h2{font-size:20px;font-weight:700;fill:#0a2742}.body{font-size:16px;fill:#3c5671}.small{font-size:14px;fill:#5f7891}.mono{font-family:Consolas,monospace;font-size:15px;fill:#72ead9}.badge{font-size:14px;font-weight:700;fill:#0863d7}.num{font-size:16px;font-weight:700;fill:#fff}.card{fill:#fff;stroke:#bed2e7;stroke-width:1.5}.button{fill:#0878f9}.buttonText{font-size:15px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1440" height="820" fill="#edf4fb"/>
  <text x="55" y="62" class="ui h1">Première connexion — retrouver le point d’accès et ouvrir Rescue</text>
  <text x="55" y="94" class="ui body">Les valeurs ci-dessous sont des exemples : utilisez celles affichées par votre propre Waveshare.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="130" width="655" height="560" rx="18" fill="#0c1724"/>
    <rect x="55" y="130" width="655" height="50" rx="18" fill="#18283a"/>
    <circle cx="85" cy="155" r="7" fill="#ff6572"/><circle cx="108" cy="155" r="7" fill="#ffc857"/><circle cx="131" cy="155" r="7" fill="#45d49c"/>
    <text x="165" y="162" class="ui" style="font-size:16px;fill:#e8f0f8">Moniteur série — COM5 — 115200 bauds</text>
    <text x="82" y="225" class="mono">[I][webinterface] Web startup release mode=ap</text>
    <text x="82" y="260" class="mono">[I][webinterface] IP=192.168.4.1 starting server</text>
    <text x="82" y="312" class="mono">[SECURITY] flow.io provisioning AP</text>
    <text x="82" y="347" class="mono">SSID=flow.io-XXXXXX</text>
    <text x="82" y="382" class="mono">password=XXXXXXXXXXXXXXXX</text>
    <text x="82" y="434" class="mono">[I][webinterface] SPIFFS mounted for web assets</text>
    <text x="82" y="469" class="mono">[I][webinterface] server started on 0.0.0.0:80</text>
    <rect x="82" y="524" width="555" height="105" rx="12" fill="#12293b" stroke="#245374"/>
    <text x="105" y="557" class="ui" style="font-size:16px;font-weight:700;fill:#fff">À relever avant de fermer le terminal</text>
    <text x="105" y="587" class="ui" style="font-size:15px;fill:#bfd4e6">• le SSID flow.io-XXXXXX</text>
    <text x="105" y="614" class="ui" style="font-size:15px;fill:#bfd4e6">• le mot de passe propre à la carte</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="130" width="635" height="560" rx="18" class="card"/>
    <rect x="750" y="130" width="635" height="54" rx="18" fill="#f8fbfe"/>
    <circle cx="779" cy="157" r="7" fill="#ff6572"/><circle cx="802" cy="157" r="7" fill="#ffc857"/><circle cx="825" cy="157" r="7" fill="#45d49c"/>
    <rect x="855" y="143" width="500" height="30" rx="15" fill="#e8f0f8"/>
    <text x="879" y="164" class="ui small">http://192.168.4.1/rescue</text>
    <rect x="775" y="205" width="585" height="78" rx="12" fill="#0d1c2e"/>
    <text x="805" y="241" class="ui" style="font-size:25px;font-weight:700;fill:#fff">flow.io Rescue</text>
    <text x="805" y="267" class="ui" style="font-size:14px;fill:#bcd0e6">Console minimale embarquée dans le firmware Waveshare</text>
    <text x="790" y="329" class="ui h2">État</text>
    <rect x="790" y="351" width="178" height="46" rx="9" fill="#e7f1ff" stroke="#8eb9ec"/>
    <text x="842" y="380" class="ui badge">Rafraîchir</text>
    <rect x="982" y="351" width="192" height="46" rx="9" fill="#e7f1ff" stroke="#8eb9ec"/>
    <text x="1017" y="380" class="ui badge">Scanner le réseau</text>
    <rect x="790" y="420" width="555" height="190" rx="10" fill="#071827"/>
    <text x="815" y="454" class="mono">{</text>
    <text x="840" y="484" class="mono">"web": { "auth_enabled": false },</text>
    <text x="840" y="514" class="mono">"network": { "mode": "ap" },</text>
    <text x="840" y="544" class="mono">"profile": "Waveshare",</text>
    <text x="840" y="574" class="mono">"firmware_version": "3.1.5"</text>
    <text x="815" y="600" class="mono">}</text>
  </g>

  <g class="ui">
    <circle cx="76" cy="735" r="20" fill="#0878f9"/><text x="71" y="741" class="num">1</text><text x="108" y="741" class="body">Noter les accès dans le moniteur série</text>
    <circle cx="510" cy="735" r="20" fill="#0878f9"/><text x="505" y="741" class="num">2</text><text x="542" y="741" class="body">Connecter le PC à flow.io-XXXXXX</text>
    <circle cx="990" cy="735" r="20" fill="#0878f9"/><text x="985" y="741" class="num">3</text><text x="1022" y="741" class="body">Ouvrir l’adresse HTTP de secours</text>
  </g>
</svg>
