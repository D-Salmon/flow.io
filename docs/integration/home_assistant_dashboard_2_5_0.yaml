# Lovelace dashboard card for Flow.io 2.5.0.
#
# Prerequisites and installation:
# `docs/integration/home-assistant-2.4.0.md`

type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Flow.io
    subtitle: Piscine
    alignment: center

  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.fio_io_ph
        name: pH
        min: 6
        max: 8.4
        needle: true
        segments:
          - from: 0
            color: "#db4437"
          - from: 6.8
            color: "#ffa600"
          - from: 7
            color: "#43a047"
          - from: 7.4
            color: "#ffa600"
          - from: 7.6
            color: "#db4437"
      - type: gauge
        entity: sensor.fio_io_orp
        name: ORP
        unit: mV
        min: 420
        max: 1020
        needle: true
        segments:
          - from: 0
            color: "#db4437"
          - from: 650
            color: "#ffa600"
          - from: 700
            color: "#43a047"
          - from: 740
            color: "#ffa600"
          - from: 790
            color: "#db4437"

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: switch.fio_io_flt_pmp
        name: Filtr.
        icon: mdi:pump
        layout: vertical
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card { background: none; box-shadow: none; border: none; }
      - type: custom:mushroom-entity-card
        entity: switch.fio_io_robot
        name: Robot
        icon: mdi:robot-vacuum
        layout: vertical
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card { background: none; box-shadow: none; border: none; }
      - type: custom:mushroom-entity-card
        entity: switch.fio_io_lights
        name: Éclairage
        icon: mdi:lightbulb
        layout: vertical
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card { background: none; box-shadow: none; border: none; }
      - type: custom:mushroom-entity-card
        entity: switch.fio_io_wat_htr
        name: Chauffage
        icon: mdi:water-boiler
        layout: vertical
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card { background: none; box-shadow: none; border: none; }

  - type: custom:mushroom-template-card
    entity: switch.fio_pl_auto
    primary: Mode piscine
    secondary: "{{ 'Automatique' if is_state(entity, 'on') else 'Manuel' }}"
    icon: "{{ 'mdi:autorenew' if is_state(entity, 'on') else 'mdi:hand-back-right' }}"
    icon_color: "{{ 'green' if is_state(entity, 'on') else 'orange' }}"
    layout: vertical
    tap_action:
      action: toggle

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: switch.fio_pl_orp_auto
        primary: Rég. ORP
        secondary: "{{ 'Auto' if is_state(entity, 'on') else 'Arrêt' }}"
        icon: mdi:chart-bell-curve-cumulative
        icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
        layout: vertical
        tap_action:
          action: none
      - type: custom:mushroom-template-card
        entity: switch.fio_io_chl_pmp
        primary: Inj. chlore
        secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
        icon: mdi:pump
        icon_color: "{{ 'amber' if is_state(entity, 'on') else 'disabled' }}"
        layout: vertical
        tap_action:
          action: none
      - type: custom:mushroom-template-card
        entity: switch.fio_pl_ph_auto
        primary: Rég. pH
        secondary: "{{ 'Auto' if is_state(entity, 'on') else 'Arrêt' }}"
        icon: mdi:chart-bell-curve-cumulative
        icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
        layout: vertical
        tap_action:
          action: none
      - type: custom:mushroom-template-card
        entity: switch.fio_io_ph_pmp
        primary: Inj. pH
        secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
        icon: mdi:pump
        icon_color: "{{ 'blue' if is_state(entity, 'on') else 'disabled' }}"
        layout: vertical
        tap_action:
          action: none

  - type: custom:mini-graph-card
    name: Températures
    hours_to_show: 6
    points_per_hour: 2
    smoothing: true
    line_width: 2
    show:
      labels: true
      legend: false
    entities:
      - entity: sensor.fio_io_air_tmp
        name: Air
        color: "#ff9800"
        show_state: true
      - entity: sensor.fio_io_wat_tmp
        name: Eau
        color: "#2196f3"
        show_state: true

  - type: custom:mini-graph-card
    name: Chimie
    hours_to_show: 6
    points_per_hour: 2
    smoothing: true
    line_width: 2
    show:
      labels: true
      legend: false
    entities:
      - entity: sensor.fio_io_ph
        name: pH
        color: "#fdd835"
        show_state: true
      - entity: sensor.fio_io_orp
        name: ORP
        color: "#2196f3"
        show_state: true
        y_axis: secondary

  - type: history-graph
    hours_to_show: 6
    entities:
      - entity: switch.fio_io_ph_pmp
        name: pH
      - entity: switch.fio_io_chl_pmp
        name: Chlore

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.fio_pd_chl_pmp_upt
        primary: Conso. chlore
        secondary: >
          {% set seconds = states('sensor.fio_pd_chl_pmp_upt') | float(0) %}
          {% set flow = states('number.fio_pd2_flow') | float(0) %}
          {% set volume = (seconds / 3600) * flow %}
          {{ ((volume * 1000) | round(0) ~ ' mL')
             if volume < 1 else (volume | round(2) ~ ' L') }}
        icon: mdi:beaker
        icon_color: teal
        layout: vertical
      - type: custom:mushroom-template-card
        entity: sensor.fio_pd_ph_pmp_upt
        primary: Conso. pH
        secondary: >
          {% set seconds = states('sensor.fio_pd_ph_pmp_upt') | float(0) %}
          {% set flow = states('number.fio_pd1_flow') | float(0) %}
          {% set volume = (seconds / 3600) * flow %}
          {{ ((volume * 1000) | round(0) ~ ' mL')
             if volume < 1 else (volume | round(2) ~ ' L') }}
        icon: mdi:flask-outline
        icon_color: blue
        layout: vertical

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.fio_pd_chl_tnk_rem
        name: Reste chlore
        icon: mdi:beaker-outline
        icon_color: teal
      - type: custom:mushroom-entity-card
        entity: sensor.fio_pd_ph_tnk_rem
        name: Reste pH
        icon: mdi:flask-empty-outline
        icon_color: blue

  - type: vertical-stack
    cards:
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_pressure_alarm
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Alerte pression
          secondary: Vérifier la pompe, le filtre et les seuils
          icon: mdi:gauge-alert
          icon_color: red
          tap_action:
            action: more-info
            entity: sensor.fio_io_psi
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_water_temperature_unavailable
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Température d'eau indisponible
          secondary: Le dernier programme de filtration est conservé
          icon: mdi:thermometer-alert
          icon_color: orange
          tap_action:
            action: more-info
            entity: sensor.fio_io_wat_tmp
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_ph_tank_low
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Bidon pH vide
          secondary: Remplacer le bidon puis déclarer son remplissage
          icon: mdi:flask-empty-off
          icon_color: red
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_chlorine_tank_low
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Bidon chlore vide
          secondary: Remplacer le bidon puis déclarer son remplissage
          icon: mdi:beaker-alert
          icon_color: red
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_ph_pump_max_uptime
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Sécurité pompe pH
          secondary: Temps de fonctionnement maximal atteint
          icon: mdi:timer-alert
          icon_color: red
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_chlorine_pump_max_uptime
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Sécurité pompe chlore
          secondary: Temps de fonctionnement maximal atteint
          icon: mdi:timer-alert
          icon_color: red
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_water_level_low
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Niveau d’eau insuffisant
          secondary: Vérifier le bassin et le skimmer
          icon: mdi:waves-arrow-down
          icon_color: red
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_filtration_contactor_mismatch
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Défaut contacteur filtration
          secondary: Le retour du contacteur ne correspond pas à la commande
          icon: mdi:electric-switch-closed
          icon_color: red
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_chlorine_generator_contactor_mismatch
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Défaut contacteur électrolyseur
          secondary: Le retour du contacteur ne correspond pas à la commande
          icon: mdi:electric-switch-closed
          icon_color: red
      - type: conditional
        conditions:
          - entity: binary_sensor.flowio_ota_signature_failures
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Tentatives OTA invalides répétées
          secondary: Vérifier l’origine des téléversements et la clé de signature
          icon: mdi:shield-alert
          icon_color: red

  - type: custom:mushroom-entity-card
    entity: input_boolean.flowio_admin_mode
    name: Réglages avancés
    icon: mdi:cog
    tap_action:
      action: toggle

  - type: conditional
    conditions:
      - entity: input_boolean.flowio_admin_mode
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: entities
          entities:
            - entity: input_select.flowio_menu_tab
              name: Choisir la section
              icon: mdi:menu

        - type: conditional
          conditions:
            - entity: input_select.flowio_menu_tab
              state: Chimie
          card:
            type: entities
            entities:
              - entity: select.fio_pl_disinfection_mode
                name: Mode de désinfection
              - entity: switch.fio_pl_ph_auto
                name: Régulation automatique pH
              - entity: number.fio_pl_ph_sp
                name: Consigne pH
              - entity: number.fio_pl_ph_win
                name: Fenêtre PID pH
              - entity: switch.fio_pl_orp_auto
                name: Régulation automatique ORP
              - entity: number.fio_pl_orp_sp
                name: Consigne ORP
              - entity: number.fio_pl_orp_win
                name: Fenêtre PID ORP
              - entity: number.fio_pd1_flow
                name: Débit pompe pH
              - entity: number.fio_pd1_max_upt
                name: Temps maximal pompe pH
              - entity: number.fio_pd2_flow
                name: Débit pompe chlore
              - entity: number.fio_pd2_max_upt
                name: Temps maximal pompe chlore
              - entity: switch.fio_io_ph_pmp
                name: Forcer la pompe pH
              - entity: switch.fio_io_chl_pmp
                name: Forcer la pompe chlore
              - entity: button.fio_pd_refill_ph
                name: Déclarer le bidon pH rempli
              - entity: button.fio_pd_refill_chl
                name: Déclarer le bidon chlore rempli

        - type: conditional
          conditions:
            - entity: input_select.flowio_menu_tab
              state: Filtration
          card:
            type: entities
            entities:
              - entity: switch.fio_pl_auto
                name: Mode automatique
              - entity: switch.fio_pl_robot_auto
                name: Cycle automatique du robot
              - entity: switch.fio_pl_winter
                name: Mode hivernage
              - entity: sensor.fio_pl_flt_start
                name: Début calculé
              - entity: sensor.fio_pl_flt_stop
                name: Fin calculée
              - entity: button.fio_pl_flt_recalc
                name: Recalculer la plage de filtration

        - type: conditional
          conditions:
            - entity: input_select.flowio_menu_tab
              state: Eau
          card:
            type: entities
            entities:
              - entity: switch.fio_pl_heater_auto
                name: Chauffage automatique
              - entity: number.fio_pl_heater_sp
                name: Température cible
              - entity: switch.fio_io_fill_pmp
                name: Forcer la pompe de remplissage
              - entity: number.fio_pd4_max_upt
                name: Temps maximal de remplissage
              - entity: switch.fio_pl_psi_monitor
                name: Surveillance de la pression
              - entity: number.fio_pl_psi_high
                name: Seuil de pression haut
              - entity: number.fio_pl_psi_low
                name: Seuil de pression bas

        - type: conditional
          conditions:
            - entity: input_select.flowio_menu_tab
              state: Système
          card:
            type: entities
            entities:
              - entity: button.fio_alm_reset_all
                name: Acquitter les alarmes mémorisées et terminées
              - entity: sensor.fio_sys_upt_mn
                name: Durée de fonctionnement
              - entity: sensor.fio_sys_hp_free
                name: Heap interne libre
              - entity: sensor.fio_sys_hp_min_free
                name: Heap interne minimale
              - entity: sensor.fio_sys_hp_frag
                name: Fragmentation du heap
